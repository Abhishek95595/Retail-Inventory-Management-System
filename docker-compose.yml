version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: rims_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-rims_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - rims_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-rims_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  rims_pgdata:
    name: rims_pgdata_dev
